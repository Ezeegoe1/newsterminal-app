# Chaque dimanche à 6 h (UTC) : ajoute les chiffres macro de la semaine, recalcule les statistiques achat / vente
# et les publie. L'appli les télécharge seule (aucune réinstallation).
name: Statistiques hebdomadaires
on:
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch.py
      - run: python scripts/stats.py
      - run: python scripts/publish_meta.py
      - run: rm -f data/px.json
      - run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add data/hist.jsonl data/stats.json version.json
          git diff --cached --quiet || git commit -m "Statistiques du $(date +%d/%m/%Y)"
          git push
